name: build
on:
  push:
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the CI directory
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Emscripten toolchain
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'

    - name: Install Native Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev cmake clang-tidy clang-format

    - name: Lint, beautify, and test
      run: |
        emcmake cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON . -B build
        cd build

        clang-tidy ../src/game.cpp -p . -- -std=c++17 -I$EMSDK/upstream/emscripten/cache/sysroot/include || true

        make beautify
        git diff --exit-code

        cd ..
        rm -rf build/

        cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON . -B build
        cd build
        make JamJarTests
        ctest

        cd ..
        rm -rf build/
        
    - name: Build WebAssembly (Duel Game)
      run: |
        emcmake cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -DJAMJAR_NATIVE_COMPILE_UNIT_TESTS=OFF . -B build
        cd build
        make Duel

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: math-duel-web-release
        path: |
          build/index.html
          build/Duel.js
          build/Duel.wasm
