name: build
on:
  push:
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: jamjarlabs/jamjar-build-image:v0.1.0
    steps:
    - name: Check out code into the CI directory
      uses: actions/checkout@v2

    - name: Lint, beautify, and test
      env:
        CC: gcc 
        CXX: g++
      run: |
        emcmake cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON . -B build
        cd build

        make lint
        make beautify
        git diff --exit-code

        cd ..
        rm -rf build/
        cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON . -B build
        cd build

        make JamJarTests
        ctest

        cd ..
        rm -rf build/

    - name: Build WebAssembly (Duel Game)
      env:
        CC: emcc
        CXX: em++
      run: |
        emcmake cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON -DJAMJAR_NATIVE_COMPILE_UNIT_TESTS=OFF . -B build
        cd build

        make Duel

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: math-duel-web-release
        path: |
          build/index.html
          build/Duel.js
          build/Duel.wasm
