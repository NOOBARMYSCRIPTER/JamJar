name: Build All Examples

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Emscripten toolchain
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 'latest'

    - name: Configure CMake with Emscripten
      run: |
        emcmake cmake -D CMAKE_EXPORT_COMPILE_COMMANDS=ON . -B build

    - name: Build each example
      run: |
        mkdir -p dist_artifacts
        
        cd build/examples
        
        for dir in */ ; do
          example_name=$(basename "$dir")
          echo "========================================="
          echo "Building example: $example_name"
          echo "========================================="
          
          cd "$dir"
          emmake make
          cd ..
          
          mkdir -p "../../dist_artifacts/$example_name"

          cp -r "$dir". "../../dist_artifacts/$example_name/" 2>/dev/null || true
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jamjar-examples-html5
        path: dist_artifacts/
        retention-days: 7
