<!DOCTYPE html>
<html>
<head>
    <title>Math Duel: JamJar Edition</title>
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #canvas-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        #canvas { width: 100%; height: 100%; display: block; }
        
        #main-menu {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(20, 20, 20, 0.85);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .menu-title { color: #ffffff; font-size: 48px; margin-bottom: 30px; text-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .start-btn {
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            color: #fff; background-color: #ff4757; border: none;
            border-radius: 8px; cursor: pointer; shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color: 0.2s;
        }
        .start-btn:hover { background-color: #ff6b81; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="main-menu">
        <h1 class="menu-title">Math Duel: Magic Caster</h1>
        <button class="start-btn" onclick="startGame()">START GAME</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="canvas" oncontextmenu="return false;"></canvas>
    </div>

    <script>
        var Module = {
            canvas: document.getElementById("canvas")
        };

        function startGame() {
            document.getElementById("main-menu").style.display = "none";
            
            if (Module.StartGameSession) {
                Module.StartGameSession();
            }
        }
    </script>
    <script src="./Duel.js"></script> 
</body>
</html>
